# Input Field
# Input Field
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(200, 200, 200, 0.2)
    check_color = rgb(204, 136, 34)
    font_color = $foreground
    fade_on_empty = false
    rounding = -1
    font_family = $font
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    fail_text = <span> $PAMFAIL </span>
    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = 🔒
    dots_size = 0.6
    dots_spacing = 0.35
    dots_center = true
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# LAYOUT
label {
    monitor =
    text = <span> $LAYOUT </span>
    color = rgb(200,200,200)
    font_size = 10
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, -150
    halign = center
    valign = center
}

# Date
label {
  monitor =
  text = cmd[update:1000] echo "<span> $(date +"%A %d %B ") </span>"
  color = rgb(250,250,250)
  font_size = 22
  font_family = JetBrains Mono Nerd Font ExtraBold Italic
  position = 0, 160
  halign = center
  valign = center
}

# Time
label {
  monitor =
  #text = cmd[update:1000] echo "$(date +"%-I:%M")"
  text = <span> $TIME  </span>
  color = rgb(240,240,240)
  font_size = 60
  font_family = JetBrains Mono Nerd Font ExtraBold Italic
  position = 0, 220
  halign = center
  valign = center
}





# User
label {
    monitor =
    text =  $USER
    color = rgb(89bda6)
    font_size = 20
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, -480
    halign = center
    valign = center
}

